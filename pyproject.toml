[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-annotation-studio"
version = "0.1.0"
description = "Annotation studio for LLM data: labeling, pairwise preference and DPO export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "fastapi>=0.95",
    "uvicorn>=0.20",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["llm_annotation_studio"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
